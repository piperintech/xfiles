.list-head{display:flex;justify-content:space-between;align-items:center;padding-block:18px 8px}
.list-head .mono{display:flex;gap:6px;align-items:center}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.song-row{width:100%;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.song-row:hover{border-color:#3a3a3a}
.song[data-open] .song-row{border-color:var(--red);border-bottom-left-radius:6px;border-bottom-right-radius:6px}
.song-row .n{font-family:var(--mono);font-size:10.5px;color:var(--red)}
.song-row .t{font-weight:600;font-size:13.5px;letter-spacing:-.01em;display:block;min-width:0}
.song-row .a{color:var(--muted);font-size:12px;display:block}
.song-row .meta{display:flex;align-items:center;gap:8px;color:var(--dim)}
.song-row svg{width:14px;height:14px;transition:transform .2s}
.song[data-open] .song-row svg.chev{transform:rotate(180deg)}
.tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.new{border-color:var(--red);color:var(--red)}
.song-body{border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;margin-top:-4px;padding:12px 12px 14px;background:#0f0f0f}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:transparent;font-size:11.5px;color:var(--ink);text-decoration:none}
.pill svg{width:12px;height:12px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.red{border-color:var(--red);color:var(--red)}
.lyrics{display:flex;flex-direction:column}
.stanza{display:flex;flex-direction:column;gap:9px}
.stanza+.stanza{margin-top:10px}
.st-n{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.ln{display:block}
.say{background:none;border:0;padding:0 0 0 4px;color:var(--dim);vertical-align:-1px}
.say svg{width:11px;height:11px}
.say:hover,.say[data-on]{color:var(--red)}
.hit{background:var(--red-soft);border-radius:4px}
.es{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.35;min-width:0}
.en{font-family:var(--sans);font-size:12.5px;line-height:1.35;color:#8a8a8a;margin-top:2px;letter-spacing:-.005em}
.meaning{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.meaning .mt{margin:0;font-size:14px;color:var(--red);line-height:1}
.meaning p.body{margin:0;color:#c9c9c9;font-size:13px;line-height:1.55;white-space:pre-line}
.hide-en .en{display:none}
.en-in{margin-top:4px;padding:5px 8px;font-family:var(--mono);font-size:11px;border-radius:8px}
.w{background:none;border:0;padding:0 1px;border-radius:4px;font-weight:inherit;cursor:pointer;text-decoration:underline dotted var(--dim);text-underline-offset:4px;text-decoration-thickness:1px}
.w:hover{color:var(--red);text-decoration-color:var(--red)}
.w[data-on]{background:var(--red);color:#fff;text-decoration:none}
.empty{display:flex;flex-direction:column;gap:8px}
.empty p{margin:0;color:var(--muted)}
.note{font-size:13px;color:var(--red);margin:0}
label{font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin-bottom:3px}
input,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:none}
input:focus,textarea:focus{border-color:var(--red)}
textarea{min-height:130px;resize:vertical;line-height:1.4}
.btn{height:32px;padding:0 14px;border-radius:99px;border:0;background:var(--red);color:#fff;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.status{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-height:1em}
.add{width:100%;margin-top:6px;background:transparent;border:1px dashed var(--line);border-radius:14px;padding:10px 12px;color:var(--muted);display:flex;align-items:center;gap:8px;font-size:12.5px}
.add svg{width:14px;height:14px}
#add-form{margin-top:8px;display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
#add-form[hidden]{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.foot .hand{font-size:13px;color:var(--muted)}
/* word sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.card{pointer-events:auto;width:100%;max-width:520px;background:#161616;border:1px solid #333;border-radius:20px;padding:14px 14px 16px;box-shadow:0 -10px 40px rgba(0,0,0,.6);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.song-row svg{transition:none}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.word{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.word-en{font-size:15px;margin-top:2px}
.word-en b{color:var(--red);font-weight:600}
.close{width:28px;height:28px;border-radius:99px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.close svg{width:12px;height:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.ex .es{font-size:13.5px}
.ctx{margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.how{margin-top:2px;height:24px;font-size:11px;color:var(--muted)}
.how:hover{color:var(--ink);border-color:#3a3a3a}
.card.tall{max-height:min(78vh,620px);overflow:auto}
.how-list{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:h}
.how-list li{display:grid;grid-template-columns:20px 1fr;gap:8px;color:#c9c9c9;font-size:13px;line-height:1.45;counter-increment:h}
.how-list li::before{content:counter(h,decimal-leading-zero);font-family:var(--mono);font-size:10px;color:var(--red);padding-top:3px}
.how-list b{color:var(--ink);font-weight:600}
.how-notes{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--ink)}
.how-notes p{margin:0}
.how-notes p{line-height:1.5}
.how-notes .sign{margin-top:6px;color:var(--muted)}
.how-notes .ps2{margin-top:10px;color:var(--red)}

love you very much, grandma."},"mi":{"lemma":"mi","pos":"adjective","tense":"","en":"my","ex_es":"Mi casa está cerca del parque.","ex_en":"My house is near the park."},"amor":{"lemma":"amor","pos":"noun","tense":"","en":"love (term of endearment: my love)","ex_es":"El amor de mi familia es muy importante.","ex_en":"My family's love is very important."}},"meaning":"The song 'El Privilegio de Amar' by Manuel Mijares is a heartfelt ballad that delves into the profound emotions and life lessons associated with love and personal growth. The lyrics speak to the ephemeral nature of illusions and the deep desire to leave a lasting impact on a loved one's soul. Mijares expresses a humble acknowledgment that he does not have all the answers to life, yet he emphasizes the importance of cherishing each day, especially when shared with someone you love.\n\nThe chorus of the song serves as a powerful mantra for living authentically and courageously. Mijares encourages the listener to express their feelings, act on their beliefs, and give generously without regret. He also advises resilience in the face of unmet expectations and the importance of never giving up. The repeated mention of not forgetting God suggests a spiritual dimension to his message, placing divine remembrance above all worldly pursuits.\n\nThe song also touches on themes of self-worth and the intrinsic value of emotions and experiences that cannot be bought. Mijares advises that one's stature in life is determined by the breadth of their thoughts and to never allow oneself to be defeated by failure. The lyrics convey a message of independence and individuality, urging the listener to be true to themselves and to remember the love that binds them, even when they are apart. 'El Privilegio de Amar' is a testament to the enduring power of love and the guiding principles that make life meaningful."}]}</script>
<script id="xf-app">
(function(){
const $=s=>document.querySelector(s);
const app=$("#app");
app.innerHTML=$("#xf-shell").innerHTML;
let state;
try{state=JSON.parse($("#xf-data").textContent)}catch(e){state={songs:[]}}
try{const local=JSON.parse(localStorage.getItem("xf-local")||"[]");local.forEach(s=>{if(!state.songs.some(x=>x.id===s.id))state.songs.push(s)})}catch(e){}
const live={};
let sample=null,artifact=null,downloads=null,readOnly=!(window.claude&&window.claude.use);
let openId=null,showEN=true,editing=false,editMean=false;

const ICON={
  chev:'<svg class="ink-wobble chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.2 9.3c2.3 2 4.4 4.2 6.9 5.9 2.3-2 4.4-4 6.7-6.1"/></svg>',
  play:'<svg class="ink-wobble" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4c4.9-.2 8.7 3.8 8.6 8.7-.2 4.8-4 8.6-8.8 8.5-4.9-.1-8.4-4.2-8.2-8.9.2-4.4 3.9-8.1 8.4-8.3z"/><path d="M10 8.4c1.9 1.1 3.8 2.3 5.4 3.6-1.8 1.2-3.5 2.4-5.4 3.6-.1-2.3 0-4.8 0-7.2z"/></svg>',
  say:'<svg class="ink-wobble" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 4.6c4.1 2.3 8 4.8 11.8 7.5-3.8 2.5-7.7 5-11.6 7.3-.3-4.9-.2-9.9-.2-14.8z"/></svg>',
  x:'<svg class="ink-wobble" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 5.2c4.4 4.3 8.6 9.1 13 13.4M18.4 5.6c-4.5 4.2-8.6 8.8-13 12.9"/></svg>'
};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=w=>w.toLowerCase().replace(/[^a-záéíóúüñ]/gi,"");

function tokens(line,qn){
  return line.split(/(\s+)/).map(t=>{
    if(/^\s+$/.test(t)||!t)return esc(t);
    const m=t.match(/^([^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*)([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+(?:[-'][A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)*)(.*)$/);
    if(!m)return esc(t);
    return esc(m[1])+'<button type="button" class="w'+(qn&&norm(m[2]).includes(qn)?' hit':'')+'" data-w="'+esc(m[2])+'">'+esc(m[2])+'</button>'+esc(m[3]);
  }).join("");
}

let query="";
function matches(s){
  if(!query)return true;
  const q=norm(query);if(!q)return true;
  if(norm(s.title).includes(q)||norm(s.artist).includes(q))return true;
  return (s.lines||[]).some(l=>l.es.split(/\s+/).some(w=>norm(w).includes(q))||norm(l.en).includes(q));
}
function stanzas(lines){const out=[];lines.forEach((l,j)=>{const k=l.st||0;(out[k]=out[k]||[]).push([l,j])});return out.filter(Boolean)}
function render(){
  const list=state.songs.filter(matches);
  $("#count").textContent=query?(list.length+" of "+state.songs.length):(state.songs.length+(state.songs.length===1?" song":" songs"));
  if(query&&list.length===1&&openId!==list[0].id)openId=list[0].id;
  $("#songs").innerHTML=list.length?list.map(s=>{
    const i=state.songs.indexOf(s);
    const open=s.id===openId;
    const ready=s.lines&&s.lines.length;
    let body="";
    if(open){
      const q=encodeURIComponent(s.title+" "+s.artist);
      const tools='<div class="tools"><a class="pill red" href="https://open.spotify.com/search/'+q+'" target="_blank" rel="noopener">'+ICON.play+'Spotify</a>'+(ready?'<button type="button" class="pill" id="t-en" aria-pressed="'+showEN+'">Translation</button>'+(readOnly?'':'<button type="button" class="pill" id="t-edit" aria-pressed="'+editing+'">'+(editing?'Done':'Write English')+'</button><button type="button" class="pill" id="t-mean" aria-pressed="'+editMean+'">'+(editMean?'Done':'Write meaning')+'</button>'):'')+'</div>';
      if(ready){
        const qn=norm(query);
        body=tools+'<div class="lyrics'+(showEN?'':' hide-en')+'">'+stanzas(s.lines).map((st,k)=>'<div class="stanza"><span class="st-n">'+String(k+1).padStart(2,"0")+'</span>'+st.map(([l,j])=>'<div class="ln"><div class="es">'+tokens(l.es,qn)+'<button type="button" class="say" data-line="'+j+'" aria-label="Hear this line">'+ICON.say+'</button></div>'+(editing?'<input class="en-in" data-line="'+j+'" value="'+esc(l.en)+'" placeholder="English for this line" aria-label="English for line '+(j+1)+'">':(l.en?'<div class="en">'+esc(l.en)+'</div>':''))+'</div>').join("")+'</div>').join("")+'</div>';
        body+=editMean?'<div class="meaning"><p class="mt ink ink-about" role="img" aria-label="what it’s about"></p><textarea id="m-text" aria-label="What the song is about" placeholder="Write what the song means" style="min-height:110px">'+esc(s.meaning||'')+'</textarea><div style="display:flex;gap:8px;align-items:center"><button type="button" class="btn" id="m-save">Save meaning</button><span class="status" id="m-status"></span></div></div>':(s.meaning?'<div class="meaning"><p class="mt ink ink-about" role="img" aria-label="what it’s about"></p><p class="body">'+esc(s.meaning)+'</p></div>':'');
        if(editing)body=tools+'<div class="empty" style="margin-bottom:12px"><p>Type the English under each line, or paste your whole translation here (one line per Spanish line, blank lines between verses are fine) and it fills in for you.</p><textarea id="en-bulk" aria-label="Paste the whole English translation" placeholder="Paste the English translation" style="min-height:80px"></textarea><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn ghost" id="en-fill">Fill lines</button><button type="button" class="btn" id="en-save">Save English</button><span class="status" id="en-status"></span></div></div>'+body.slice(tools.length);
      }else{
        body=tools+'<div class="empty"><p class="note hand">this one still needs its lyrics</p><p>Paste the Spanish lyrics below, with a blank line between verses. XFILES adds the English under each line and gets every word ready to tap.</p><textarea id="s-lyrics" aria-label="Lyrics for '+esc(s.title)+'" placeholder="Paste the lyrics here"></textarea><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn" id="s-go" data-id="'+s.id+'">Prepare song</button><span class="status" id="s-status"></span></div></div>';
      }
      body='<div class="song-body">'+body+'</div>';
    }
    const tag=ready?'<span class="tag">'+s.lines.length+' lines</span>':'<span class="tag new">set up</span>';
    return '<li class="song" data-id="'+s.id+'"'+(open?' data-open':'')+'><button type="button" class="song-row" aria-expanded="'+open+'"><span class="n">'+String(i+1).padStart(3,"0")+'</span><span style="min-width:0"><span class="t">'+esc(s.title)+'</span><span class="a">'+esc(s.artist)+'</span></span><span class="meta">'+tag+ICON.chev+'</span></button>'+body+'</li>';
  }).join(""):'<li class="mono" style="padding:14px 4px">no song or word matches “'+esc(query)+'”</li>';
}
function showHow(){
  const sh=$("#sheet");sh.hidden=false;
  sh.innerHTML='<div class="card tall" role="dialog" aria-label="How XFILES works"><div class="card-top"><div><div class="word">how it works</div><div class="word-en" style="color:var(--muted);font-size:13px">XFILES teaches Spanish through songs.</div></div><button type="button" class="close" id="sh-x" aria-label="Close">'+ICON.x+'</button></div>'+
  '<ol class="how-list"><li><span><b>Pick a song.</b> Tap it and the lyrics open right there.</span></li><li><span><b>Read along.</b> The English sits under each Spanish line. Tap Translation to hide it and test yourself.</span></li><li><span><b>Tap any word.</b> You get what it means, its tense, the word it comes from and a new sentence using it.</span></li><li><span><b>Tap ▷</b> next to a line to hear it in Spanish.</span></li><li><span><b>Play it on Spotify</b> and sing along while you read.</span></li><li><span><b>Read what it’s about</b> at the end of each song.</span></li><li><span><b>Search</b> for a word to find every line it shows up in.</span></li></ol>'+
  '<div class="how-notes"><span class="ink ink-ps" role="img" aria-label="P.S. Ay chini, I’m excited for you to hear these masterpieces for the first time."></span><span class="ink ink-sign" role="img" aria-label="Con amor, Manu"></span><span class="ink ink-ps2" role="img" aria-label="P.S.2: Remember, nada es gratis en esta vida."></span></div></div>';
}
function closeSheet(){const sh=$("#sheet");sh.hidden=true;sh.innerHTML="";document.querySelectorAll(".w[data-on]").forEach(b=>b.removeAttribute("data-on"))}
function showWord(btn){
  const song=state.songs.find(s=>s.id===openId);if(!song)return;
  document.querySelectorAll(".w[data-on]").forEach(b=>b.removeAttribute("data-on"));btn.setAttribute("data-on","");
  const raw=btn.dataset.w,key=norm(raw);
  const line=btn.closest(".es").textContent;
  const g=(song.glossary||{})[key]||live[song.id+"|"+key];
  const sh=$("#sheet");sh.hidden=false;
  const head='<div class="card-top"><div><div class="word">'+esc(raw.toLowerCase())+'</div>';
  const close='</div><button type="button" class="close" id="sh-x" aria-label="Close">'+ICON.x+'</button></div>';
  if(g){
    sh.innerHTML='<div class="card" role="dialog" aria-label="'+esc(raw)+'">'+head+'<div class="word-en">means <b>'+esc(g.en)+'</b></div>'+close+
    '<div class="facts">'+(g.pos?'<span class="tag">'+esc(g.pos)+'</span>':'')+(g.lemma&&norm(g.lemma)!==key?'<span class="tag">from '+esc(g.lemma)+'</span>':'')+(g.tense?'<span class="tag new">'+esc(g.tense)+'</span>':'')+'</div>'+
    (g.ex_es?'<div class="ex"><span class="mono">another way to use it</span><div class="es">'+esc(g.ex_es)+'</div><div class="en">'+esc(g.ex_en)+'</div></div>':'')+
    '<div class="ctx">in the song: '+esc(line)+'</div></div>';
  }else{
    sh.innerHTML='<div class="card" role="dialog">'+head+'<div class="word-en" id="sh-msg" style="color:var(--muted)">'+(sample?'Looking it up…':'Not in this song’s notes yet.')+'</div>'+close+'<div class="ctx">in the song: '+esc(line)+'</div></div>';
    if(sample)lookup(song,key,raw,line,btn);
  }
}
async function lookup(song,key,raw,line,btn){
  try{
    const r=await sample.json('A beginner is learning Spanish from a song. Explain the word "'+raw+'" as used in this line: "'+line+'". Reply with only a JSON object {"lemma": dictionary form, "pos": part of speech in English, "tense": for verbs the tense and person in English like "present · yo", otherwise "", "en": short English meaning here, "ex_es": a new short everyday Spanish example sentence using the word, "ex_en": its English translation}.',{modelTier:"quick",cache:{gcTime:86400000}});
    live[song.id+"|"+key]=r;
    if(btn.isConnected&&btn.hasAttribute("data-on"))showWord(btn);
  }catch(e){const m=$("#sh-msg");if(m)m.textContent=e.code==="not_granted"?"Looking up new words needs Claude, which this view doesn’t allow.":"Couldn’t look that up right now. Tap the word to try again.";if(e.code==="not_granted"||e.code==="sampling_disabled")sample=null}
}

function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}
async function prepare(title,artist,text,statusEl,existingId){
  const raw=text.split(/\r?\n/).map(l=>l.trim());let st=0,prevBlank=false;const stOf=[];const lines=[];raw.forEach(l=>{if(!l){prevBlank=true;return}if(prevBlank&&lines.length)st++;prevBlank=false;lines.push(l);stOf.push(st)});
  if(!lines.length){statusEl.textContent="Paste at least one line first.";return false}
  if(!sample){statusEl.textContent="Preparing songs needs Claude. Open XFILES on claude.ai to add songs.";return false}
  try{
    statusEl.textContent="Translating "+lines.length+" lines…";
    const en=await sample.json('Translate each line of these Spanish song lyrics into natural, simple English for a beginner learner. Keep the meaning, not word-for-word. Reply with only a JSON array of exactly '+lines.length+' strings, same order.\n\n'+lines.map((l,i)=>(i+1)+". "+l).join("\n"));
    const words=[...new Set(lines.flatMap(l=>l.split(/\s+/).map(norm).filter(Boolean)))];
    const glossary={};
    const parts=chunk(words,45);
    for(let i=0;i<parts.length;i++){
      statusEl.textContent="Getting words ready… "+Math.min((i+1)*45,words.length)+" of "+words.length;
      const r=await sample.json('These Spanish words come from the song lyrics below. For each word give beginner learner notes. Reply with only a JSON object whose keys are the words exactly as listed and whose values are {"lemma": dictionary form, "pos": part of speech in English (verb, noun, adjective, pronoun, article, preposition…), "tense": for verbs the tense and person in English like "present · yo" or "preterite · él", otherwise "", "en": short English meaning as used in this song, "ex_es": a new short everyday Spanish sentence using the word (not from the song), "ex_en": its English translation}.\n\nWords: '+parts[i].join(", ")+'\n\nLyrics:\n'+lines.slice(0,60).join("\n"));
      Object.keys(r||{}).forEach(k=>{glossary[norm(k)]=r[k]});
    }
    const song={id:existingId||("s"+Date.now().toString(36)),title,artist,lines:lines.map((l,i)=>({es:l,en:(Array.isArray(en)&&en.length===lines.length&&!/can.t provide|copyright/i.test(String(en[0])))?String(en[i]||""):"",st:stOf[i]})),glossary};
    const idx=state.songs.findIndex(s=>s.id===song.id);
    if(idx>=0)state.songs[idx]=song;else state.songs.push(song);
    openId=song.id;
    statusEl.textContent="Saving…";
    await save(statusEl);
    render();
    return true;
  }catch(e){
    statusEl.textContent=e&&e.code==="not_granted"?"Claude wasn’t allowed for this page, so the song couldn’t be prepared.":"Something went wrong preparing it. Try again in a moment.";
    return false;
  }
}

function pageHTML(){
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  const data=JSON.stringify({songs:state.songs}).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    '<title>XFILES</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="xf-style">'+$("#xf-style").textContent+'</style>\n<template id="xf-shell">'+$("#xf-shell").innerHTML+'</template>\n<div id="app"></div>\n<script type="application/json" id="xf-data">'+data+'<\/script>\n<script id="xf-app">'+$("#xf-app").textContent+'<\/script>';
}
function saveLocal(){try{const ids=new Set(JSON.parse($("#xf-data").textContent).songs.map(s=>s.id));localStorage.setItem("xf-local",JSON.stringify(state.songs.filter(s=>!ids.has(s.id))))}catch(e){}}
async function save(statusEl){
  if(artifact&&!readOnly){
    try{await artifact.publish(pageHTML());statusEl.textContent="Saved for everyone.";return}
    catch(e){
      if(e.code==="conflict"){statusEl.textContent="Someone saved at the same time. Reloading…";return}
      if(["not_writer","not_granted","consent_required","capability_disabled"].includes(e.code))readOnly=true;
    }
  }
  saveLocal();statusEl.textContent="Saved on this device.";
}

document.addEventListener("click",e=>{
  const row=e.target.closest(".song-row");
  if(row){const id=row.closest(".song").dataset.id;openId=openId===id?null:id;closeSheet();render();if(openId){const el=document.querySelector('.song[data-id="'+openId+'"]');el&&el.scrollIntoView({block:"nearest",behavior:"smooth"})}return}
  const say=e.target.closest(".say");if(say){speak(say);return}
  const w=e.target.closest(".w");if(w){showWord(w);return}
  if(e.target.closest("#sh-x")){closeSheet();return}
  if(e.target.closest("#how")){showHow();return}
  if(e.target.closest("#t-mean")){editMean=!editMean;closeSheet();render();if(editMean){const t=$("#m-text");t&&t.focus()}return}
  if(e.target.closest("#m-save")){const song=state.songs.find(x=>x.id===openId);song.meaning=$("#m-text").value.trim();const st=$("#m-status");st.textContent="Saving…";e.target.closest("#m-save").disabled=true;save(st).then(()=>{editMean=false;render()});return}
  if(e.target.closest("#t-edit")){editing=!editing;closeSheet();render();return}
  if(e.target.closest("#en-fill")){const t=$("#en-bulk").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);document.querySelectorAll(".en-in").forEach((inp,k)=>{if(t[k]!=null)inp.value=t[k]});$("#en-status").textContent=t.length+" lines filled. Check them, then save.";return}
  if(e.target.closest("#en-save")){const song=state.songs.find(x=>x.id===openId);document.querySelectorAll(".en-in").forEach(inp=>{song.lines[+inp.dataset.line].en=inp.value.trim()});const st=$("#en-status");st.textContent="Saving…";e.target.closest("#en-save").disabled=true;save(st).then(()=>{editing=false;render()});return}
  if(e.target.closest("#t-en")){showEN=!showEN;try{localStorage.setItem("xf-en",showEN?"1":"0")}catch(_){}render();return}
  const go=e.target.closest("#s-go");
  if(go){const s=state.songs.find(x=>x.id===go.dataset.id);go.disabled=true;prepare(s.title,s.artist,$("#s-lyrics").value,$("#s-status"),s.id).then(ok=>{if(!ok&&go.isConnected)go.disabled=false});return}
  if(e.target.closest("#add-toggle")){const f=$("#add-form");f.hidden=!f.hidden;if(!f.hidden)$("#f-title").focus();return}
  if(e.target.closest("#f-cancel")){$("#add-form").hidden=true;return}
  if(e.target.closest("#dl")&&downloads){downloads.save({filename:"index.html",data:pageHTML()}).catch(()=>{});return}
  if(!e.target.closest(".card"))closeSheet();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
let qt;$("#q").addEventListener("input",e=>{clearTimeout(qt);qt=setTimeout(()=>{query=e.target.value.trim();closeSheet();render()},150)});
function speak(btn){
  const song=state.songs.find(s=>s.id===openId);if(!song||!("speechSynthesis" in window))return;
  const l=song.lines[+btn.dataset.line];if(!l)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(l.es);u.lang="es-MX";u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v)u.voice=v;
  document.querySelectorAll(".say[data-on]").forEach(b=>b.removeAttribute("data-on"));btn.setAttribute("data-on","");
  u.onend=u.onerror=()=>btn.removeAttribute("data-on");speechSynthesis.speak(u)}catch(_){}
}
$("#add-form").addEventListener("submit",async e=>{
  e.preventDefault();const b=$("#f-go");b.disabled=true;
  const ok=await prepare($("#f-title").value.trim(),$("#f-artist").value.trim(),$("#f-lyrics").value,$("#f-status"));
  b.disabled=false;if(ok){$("#add-form").hidden=true;$("#add-form").reset()}
});

try{showEN=localStorage.getItem("xf-en")!=="0"}catch(_){}
render();
if(window.claude&&claude.use){
  claude.use("sample").then(s=>{sample=s}).catch(()=>{});
  claude.use("artifact").then(a=>{artifact=a}).catch(()=>{});
  claude.use("downloads").then(d=>{downloads=d;if(d)$("#dl").hidden=false}).catch(()=>{});
}
})();
</script>
</body></html>
